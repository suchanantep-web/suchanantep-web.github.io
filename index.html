<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js 3D Model with Marker</title>
    
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- A-Frame Extras (สำหรับการเล่น Animation ของ 3D Model) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- A-Frame Scene กำหนดการใช้งาน AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- โหลด Asset (3D Model) -->
        <a-assets>
            <a-asset-item id="epona-model" src="https://suchanantep.github.io/epona.glb"></a-asset-item>
        </a-assets>

        <!-- 
            หมายเหตุเกี่ยวกับ Custom Marker:
            AR.js จะใช้ไฟล์รูปแบบ .patt สำหรับการตรวจจับ Marker Pattern 
            หากต้องการทดสอบเบื้องต้น ให้เปลี่ยนเป็น <a-marker preset="hiro"> 
        -->
        <a-marker type="pattern" url="path/to/your/tracker.patt">
            <!-- แสดงผล 3D Model พร้อมสั่งเล่น Animation (animation-mixer) -->
            <a-entity 
                gltf-model="#epona-model" 
                scale="0.5 0.5 0.5" 
                position="0 0 0" 
                rotation="0 0 0" 
                animation-mixer>
            </a-entity>
        </a-marker>

        <!-- กำหนด Camera ของ AR -->
        <a-entity camera></a-entity>
        
    </a-scene>

</body>
</html>
