<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suchanantep | 3D Horse & Interactive Water Shader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030508; color: #fff; }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; color: #4facfe; background: rgba(3,5,8,0.9); padding: 1rem 2rem;
            border-radius: 8px; border: 1px solid #4facfe; transition: opacity 0.5s;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading">LOADING HORSE MODEL...</div>
    <div id="webgl-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // -------------------------------------------------------------
        // วางข้อความ Base64 ของไฟล์ epona.glb ที่แปลงมาในอัญประกาศนี้
        // -------------------------------------------------------------
        const EPONA_BASE64 = "data:application/octet-stream;base64,ใส่ข้อความ_Base64_ตรงนี้";

        let mixer = null;
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060c18);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2, 0);

        // แสงสว่าง
        scene.add(new THREE.AmbientLight(0xffffff, 2.0));
        const sun = new THREE.DirectionalLight(0xfff0dd, 3.0);
        sun.position.set(10, 25, 15);
        scene.add(sun);

        // ฐานรอง
        const pedestal = new THREE.Mesh(
            new THREE.CylinderGeometry(2.0, 2.5, 1.0, 32),
            new THREE.MeshStandardMaterial({ color: 0x1a2230 })
        );
        pedestal.position.set(0, 0.7, 0);
        scene.add(pedestal);

        // โหลดโมเดลม้าจาก Base64 โดยตรง (ไม่ผ่าน Server / ไม่ติด CORS)
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');

        loader.load(
            EPONA_BASE64,
            (gltf) => {
                const model = gltf.scene;
                model.position.set(0, 1.2, 0);
                model.scale.set(2.5, 2.5, 2.5);
                scene.add(model);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    mixer.clipAction(gltf.animations[0]).play();
                }

                loadingEl.style.opacity = '0';
                setTimeout(() => loadingEl.remove(), 500);
            },
            undefined,
            (error) => {
                console.error("Base64 Error:", error);
                loadingEl.innerText = 'กรุณาใส่ข้อความ Base64 ของ epona.glb ให้ถูกต้อง';
            }
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
