<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Face Blendshape</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #111; font-family: system-ui, sans-serif; }
    #container { position: fixed; inset: 0; overflow: hidden; }
    #start, #status {
      position: fixed;
      z-index: 5;
      left: 50%;
      transform: translateX(-50%);
    }
    #start {
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 12px 20px;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }
    #start:disabled { opacity: .65; cursor: wait; }
    #status {
      top: max(12px, env(safe-area-inset-top));
      max-width: calc(100vw - 24px);
      padding: 9px 12px;
      border-radius: 4px;
      background: #111c;
      color: #fff;
      text-align: center;
    }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <button id="start" type="button">เริ่มกล้อง</button>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');
    const startButton = document.querySelector('#start');
    const status = document.querySelector('#status');
    const mindar = new MindARThree({ container });
    const { renderer, scene, camera } = mindar;
    const anchor = mindar.addAnchor(168);
    const meshes = [];
    let avatarScene = null;
    let started = false;

    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    startButton.addEventListener('click', async () => {
      if (started) return;
      startButton.disabled = true;
      status.textContent = 'กำลังโหลดโมเดล...';

      try {
        const gltf = await new GLTFLoader().loadAsync('./Untitled.glb');
        avatarScene = gltf.scene;

        // Center the model's own origin and size it to the tracked face width.
        avatarScene.updateMatrixWorld(true);
        const bounds = new THREE.Box3().setFromObject(avatarScene);
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        const scale = size.x > 0.001 ? 0.95 / size.x : 1;
        avatarScene.scale.setScalar(scale);
        avatarScene.position.set(
          -center.x * scale,
          -center.y * scale,
          -center.z * scale + 0.15
        );

        avatarScene.traverse(object => {
          if (object.isMesh && object.morphTargetDictionary && object.morphTargetInfluences) {
            meshes.push(object);
          }
        });
        anchor.group.add(avatarScene);

        status.textContent = meshes.length
          ? 'กำลังเริ่มกล้อง...'
          : 'โมเดลนี้ไม่มี Morph Targets สำหรับขยับสีหน้า';

        await mindar.start();
        started = true;
        startButton.hidden = true;
        if (meshes.length) status.textContent = 'หันหน้าเข้ากล้อง';

        renderer.setAnimationLoop(() => {
          const categories = mindar.getLatestEstimate()?.blendshapes?.categories ?? [];
          for (const mesh of meshes) {
            for (const { categoryName, score } of categories) {
              const index = mesh.morphTargetDictionary[categoryName];
              if (index !== undefined) mesh.morphTargetInfluences[index] = score;
            }
          }
          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error(error);
        if (avatarScene) anchor.group.remove(avatarScene);
        avatarScene = null;
        meshes.length = 0;
        status.textContent = `เริ่มไม่ได้: ${error.message || error}`;
        startButton.disabled = false;
      }
    });
  </script>
</body>
</html>
