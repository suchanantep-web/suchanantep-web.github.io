<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MindAR Face Blendshape</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>

<body>

<div id="container"></div>

<script type="module">

  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { MindARThree } from 'mindar-face-three';


  // =========================
  // เริ่มต้น MindAR
  // =========================

  const mindar = new MindARThree({
    container: document.querySelector('#container')
  });

  const {
    renderer,
    scene,
    camera
  } = mindar;


  // =========================
  // Environment / แสง
  // =========================

  const pmremGenerator = new THREE.PMREMGenerator(renderer);

  const roomEnvironment = new RoomEnvironment();

  const environmentTarget =
    pmremGenerator.fromScene(roomEnvironment);

  scene.environment = environmentTarget.texture;

  roomEnvironment.dispose();
  pmremGenerator.dispose();


  // แสง
  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      1
    )
  );


  // =========================
  // โหลดโมเดล
  // =========================

  const loader = new GLTFLoader();

  const model = await loader.loadAsync(
    'https://nj1214.github.io/NJJ1214.github.io/NAKHEADAR.glb'
  );


  // =========================
  // ตั้งค่าตัวโมเดล
  // =========================

  model.scene.scale.setScalar(1);

  // ⭐ หมุนโมเดลให้หันหน้าตรงเข้ากล้อง
  model.scene.rotation.set(
    0,
    Math.PI / 2,
    0
  );


  // =========================
  // เพิ่มโมเดลเข้า Face Anchor
  // =========================

  const anchor = mindar.addAnchor(1);

  anchor.group.add(model.scene);


  // =========================
  // หา Mesh ที่มี Blendshape
  // =========================

  const meshes = [];

  model.scene.traverse((object) => {

    if (
      object.isMesh &&
      object.morphTargetDictionary &&
      object.morphTargetInfluences
    ) {
      meshes.push(object);
    }

  });


  // =========================
  // เริ่มกล้อง
  // =========================

  await mindar.start();


  // =========================
  // Animation Loop
  // =========================

  function animate() {

    requestAnimationFrame(animate);


    // รับข้อมูล Blendshape จากใบหน้าจริง
    const categories =
      mindar.getLatestEstimate()
        ?.blendshapes
        ?.categories;


    // ส่งค่า Blendshape
    // จากใบหน้าจริง → โมเดล 3D

    for (const mesh of meshes) {

      for (const {
        categoryName,
        score
      } of categories ?? []) {

        const index =
          mesh.morphTargetDictionary[categoryName];

        if (index !== undefined) {

          mesh.morphTargetInfluences[index] = score;

        }

      }

    }


    // Render
    renderer.render(
      scene,
      camera
    );

  }


  animate();

</script>

</body>
</html>
